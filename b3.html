<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0ea5e9">
<title>ماموریت قهرمان‌های کلاس اول | دبستان نبوت</title>
<style>
:root{
 --bg1:#b9e7ff;--bg2:#fff0a8;--card:#ffffff;--ink:#102347;--muted:#405174;--line:#15345f;
 --blue:#087fc9;--blue2:#034f8a;--green:#159a4a;--green2:#086630;--purple:#7a3ce8;--purple2:#4d209e;--orange:#f07a0b;--orange2:#ad4307;
 --yellow:#facc15;--pink:#e11d68;--red:#dc2626;--shadow:0 7px 0 rgba(15,45,92,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink)}
body{min-height:100svh;background:
 radial-gradient(circle at 8% 11%,#fff 0 12px,transparent 13px),
 radial-gradient(circle at 16% 15%,#fff 0 19px,transparent 20px),
 radial-gradient(circle at 88% 8%,#fff 0 15px,transparent 16px),
 radial-gradient(circle at 94% 13%,#fff 0 22px,transparent 23px),
 linear-gradient(155deg,var(--bg1),#e9f8ff 47%,var(--bg2));background-attachment:fixed}
button,input{font:inherit}button{touch-action:manipulation}.shell{max-width:590px;margin:auto;padding:24px 12px 26px}
.round{width:50px;height:50px;border-radius:50%;border:3px solid #0f2d5c;background:#fff;box-shadow:0 4px 0 #0f2d5c33;font-size:24px;cursor:pointer}
.school{width:max-content;max-width:100%;margin:0 auto 7px;padding:5px 13px;background:#fff;border:2px solid #0f2d5c;border-radius:18px;font-weight:900;font-size:12px;color:#0f2d5c}
h1{margin:4px 0 0;text-align:center;font-size:clamp(27px,7vw,37px);font-weight:900;line-height:1.22;color:#0f2d5c;text-shadow:0 2px 0 #fff,0 4px 0 #facc15}
.sub{text-align:center;font-weight:900;font-size:16px;margin:5px 0 12px;color:#243b64}
.card{background:var(--card);border:4px solid var(--line);border-radius:25px;padding:15px;margin:12px 0;box-shadow:var(--shadow)}
.hero{display:flex;align-items:center;gap:11px}.hero-face{width:72px;height:72px;display:grid;place-items:center;border-radius:50%;background:#e0f2fe;border:4px solid #0879c9;font-size:43px;flex:none;animation:bob 2s ease-in-out infinite}.bubble{background:#fff9c9;border:3px solid #b45309;border-radius:20px;padding:10px 12px;font-size:15px;font-weight:900;line-height:1.9;flex:1}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.big-emoji{font-size:72px;text-align:center;line-height:1.1}.q{font-size:clamp(24px,6.4vw,31px);font-weight:900;line-height:1.65;margin:10px 0 12px;text-align:center;color:#102347;letter-spacing:-.2px}.task-title{width:max-content;max-width:100%;margin:2px auto 5px;padding:4px 12px;border-radius:999px;background:#15345f;color:#fff;font-size:14px;font-weight:900}.question-help{font-size:16px;font-weight:900;text-align:center;color:#334155;margin:6px 0 8px}.hint{font-size:17px;font-weight:900;color:#27215e;background:#fff6c9;border:3px dashed #7c3aed;border-radius:16px;padding:9px 11px;margin:8px 0;text-align:center;line-height:1.8}
.input{width:100%;padding:15px;border:4px solid #0879c9;border-radius:20px;background:#fff;color:#101a3a;text-align:center;font-weight:900;font-size:21px;outline:none}.input:focus{border-color:#035b9c;box-shadow:0 0 0 4px #38bdf866}
.btn{width:100%;min-height:58px;border:3px solid #923b06;border-radius:20px;padding:12px 14px;margin-top:10px;background:linear-gradient(#fb923c,#e8790c);color:#fff;font-weight:900;font-size:19px;box-shadow:0 5px 0 #923b06;cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #923b06}.btn.secondary{background:#fff;color:#26385d;border-color:#8da0bd;box-shadow:0 5px 0 #aab7ca}.btn.green{background:linear-gradient(#28c76f,#159447);border-color:#0b6a32;box-shadow:0 5px 0 #0b6a32}.btn.blue{background:linear-gradient(#22a8ee,#0879c9);border-color:#035b9c;box-shadow:0 5px 0 #035b9c}
.mission{width:100%;display:flex;align-items:center;gap:11px;color:#fff;text-align:right;cursor:pointer}.mission:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(16,26,58,.25)}.mission .ic{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:39px;flex:none;border:3px solid #101a3a}.mission .txt{flex:1}.mission b{display:block;font-size:20px}.mission small{display:block;font-weight:900;opacity:1;margin-top:3px}.mission .score{background:#0b244ccc;border:2px solid #fff;border-radius:14px;padding:5px 8px;font-weight:900;font-size:14px;white-space:nowrap}
.progress-wrap{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:900;font-size:13px;background:#fff;border:2px solid #0f2d5c;border-radius:14px;padding:5px 8px}.bar{height:17px;background:#fff;border:3px solid #0f2d5c;border-radius:12px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#159447 0 12px,#39c779 12px 24px);transition:width .25s}
.page-thumb{display:block;width:100%;max-height:220px;object-fit:contain;border-radius:18px;background:#fff;border:3px solid #0879c9;margin:8px auto}.tags{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:8px 0}.tag{font-size:12px;font-weight:900;border:2px solid #0f2d5c;background:#eef8ff;border-radius:999px;padding:4px 9px;color:#0f2d5c}.level-list{display:grid;gap:8px;margin:10px 0}.level-chip{display:flex;align-items:center;justify-content:space-between;border:3px solid #0f2d5c;border-radius:16px;padding:8px 10px;background:#f8fbff;font-weight:900}.level-chip b{font-size:15px}.level-badge{color:#fff;border-radius:10px;padding:3px 8px;font-size:12px;background:#0f2d5c}
.feedback{min-height:34px;font-size:18px;font-weight:900;text-align:center;margin-top:8px;color:#0b6a32}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.imgopt{position:relative;min-height:118px;border:4px solid #0879c9;border-radius:20px;background:#f8fcff;padding:5px;overflow:hidden;cursor:pointer;box-shadow:0 4px 0 #035b9c}.imgopt img{display:block;width:100%;height:118px;object-fit:contain;border-radius:13px;background:#fff}.imgopt.sel{outline:5px solid #facc15;background:#fff4b5}.imgopt.ok{border-color:#159447;box-shadow:0 4px 0 #0b6a32;background:#dcfce7}.imgopt.ok:after{content:'✓';position:absolute;top:5px;left:5px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#159447;color:#fff;font-size:23px;font-weight:900}.imgopt.no{border-color:#e8790c;background:#ffedd5;opacity:.86}
.choice{display:block;width:100%;min-height:60px;border:3px solid #0f2d5c;border-radius:18px;margin:9px 0;padding:12px 14px;background:#edf7ff;color:#101a3a;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #0f2d5c}.choice:nth-of-type(3n+2){background:#fff3b0}.choice:nth-of-type(3n){background:#e8defe}.choice.ok{background:#159447!important;color:#fff;border-color:#0b6a32}.choice.no{background:#fed7aa!important;border-color:#e8790c}.yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yesno .choice{text-align:center;font-size:20px}
.single-image{display:block;width:min(250px,78%);height:190px;object-fit:contain;margin:8px auto;border:4px solid #0f2d5c;border-radius:20px;background:#fff}.checkline{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.checkline b{font-size:16px}
.match-zone{direction:ltr;display:grid;grid-template-columns:minmax(0,1.35fr) 34px minmax(110px,.8fr);gap:7px;align-items:center;margin:12px 0}.paint-panel,.ref-panel{border:3px solid #0f2d5c;border-radius:20px;background:#f8fbff;padding:9px;min-height:150px}.paint-panel b,.ref-panel b{display:block;text-align:center;font-size:14px;color:#0f2d5c;margin-bottom:6px}.ref-icons{font-size:32px;line-height:1.45;text-align:center;word-break:break-word}.arrow{font-size:30px;text-align:center;color:#e8790c;font-weight:900}.paint-row{display:grid;gap:7px;grid-template-columns:repeat(var(--cols),1fr)}.paintable{aspect-ratio:1;border:3px solid #0f2d5c;background:#fff;border-radius:14px;padding:4px;cursor:pointer}.paintable svg{width:100%;height:100%}.paintable .fillable{fill:#fff;transition:.15s}.paintable.painted{background:#fff8cf;outline:4px solid #facc15}.paintable.painted .fillable{fill:var(--paint)}
.grid3{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:340px;margin:12px auto}.gcell{aspect-ratio:1;background:#fff;border:3px solid #0f2d5c;border-radius:13px;display:grid;place-items:center;min-width:0}.gcell svg{width:70%;height:70%}.missing{font-size:34px;color:#e8790c;font-weight:900}.grid-options{direction:ltr;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.gridopt{aspect-ratio:1;border:3px solid #0f2d5c;border-radius:15px;background:#fff;box-shadow:0 3px 0 #0f2d5c;cursor:pointer;padding:5px}.gridopt svg{width:100%;height:100%}.gridopt.ok{outline:5px solid #159447;background:#dcfce7}.gridopt.no{opacity:.65;outline:4px solid #e8790c}.rulebox{background:#fff7cd;border:3px solid #b45309;border-radius:15px;padding:7px 9px;text-align:center;font-size:13px;font-weight:900;color:#5b3511}
.tracebox{position:relative;width:100%;aspect-ratio:560/230;background:#fff;border:4px solid #0f2d5c;border-radius:22px;overflow:hidden;touch-action:none;user-select:none}.tracebox svg,.tracebox canvas{position:absolute;inset:0;width:100%;height:100%}.tracebox canvas{z-index:3}.tracebox svg{z-index:2}.trace-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;font-weight:900;margin:7px 0}.trace-legend span{background:#eef8ff;border:2px solid #0879c9;border-radius:12px;padding:6px;text-align:center}.trace-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.trace-actions .btn{font-size:16px;min-height:52px}.baseline-note{background:#fff3b0;border:3px solid #b45309;border-radius:15px;padding:8px 10px;font-weight:900;font-size:14px;text-align:center;color:#5b3511}
.entry-card{background:linear-gradient(145deg,#ffffff,#eef9ff);border:4px solid #15345f;border-radius:28px;padding:18px;margin:14px 0;box-shadow:0 8px 0 #15345f33}.entry-icon{width:92px;height:92px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:58px;background:linear-gradient(145deg,#ffe66d,#ffb703);border:4px solid #15345f;box-shadow:0 5px 0 #15345f33;animation:bob 2s ease-in-out infinite}.entry-mini{display:flex;justify-content:center;gap:9px;font-size:26px;margin:4px 0 10px}.footer{text-align:center;margin:16px 0 2px;font-size:12px;font-weight:900;color:#20365d}.leveldone{text-align:center}.leveldone .medal{font-size:72px}.tiny{font-size:12px;color:#475569;font-weight:800;text-align:center}
.report-wrap{min-height:100svh;padding:8px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#dff4ff,#fff7cc)}.report{width:min(560px,100%);background:#fff;border:4px solid #0f2d5c;border-radius:24px;padding:12px;box-shadow:0 8px 0 #0f2d5c33;text-align:center}.report h2{margin:0;font-size:23px;color:#0f2d5c}.report-name{font-size:20px;font-weight:900;margin:4px 0 7px}.score-ring{width:104px;height:104px;margin:4px auto 8px;border-radius:50%;background:conic-gradient(#159447 var(--score),#dbeafe 0);display:grid;place-items:center;border:3px solid #0f2d5c}.score-ring>div{width:78px;height:78px;border-radius:50%;background:#fff;display:grid;place-items:center;align-content:center;font-weight:900}.score-ring b{font-size:27px}.score-ring span{font-size:12px}.skillrow{display:grid;grid-template-columns:88px 1fr 34px;gap:6px;align-items:center;margin:6px 0;font-size:13px;font-weight:900}.skillbar{height:13px;border:2px solid #0f2d5c;border-radius:9px;overflow:hidden;background:#e5e7eb}.skillbar i{display:block;height:100%;background:#159447}.report-note{font-size:12px;font-weight:900;background:#fff7cd;border:2px dashed #b45309;border-radius:12px;padding:6px;margin-top:6px}.meta{font-size:10.5px;font-weight:800;color:#475569;margin-top:6px}.shot{font-size:12px;font-weight:900;color:#0f2d5c;background:#e0f2fe;border-radius:12px;padding:5px;margin-top:5px}
@media(max-width:390px){.shell{padding-inline:9px}.card{padding:12px}.mission .ic{width:56px;height:56px;font-size:34px}.mission b{font-size:18px}.options{gap:7px}.imgopt{min-height:104px}.imgopt img{height:104px}.grid-options{gap:5px}.trace-legend{font-size:11px}.ref-icons{font-size:28px}.paint-panel,.ref-panel{padding:6px}.match-zone{grid-template-columns:minmax(0,1.5fr) 28px minmax(95px,.75fr)}}
@media(max-height:720px){.report{padding:8px}.report h2{font-size:20px}.score-ring{width:88px;height:88px}.score-ring>div{width:66px;height:66px}.skillrow{margin:4px 0}.report-note{padding:4px}.shot{padding:4px}}
</style>
</head>

function finishSubject(){const {s}=currentData(),pct=subjectPercent(s.id);app.innerHTML=`<div class="school">دبستان نبوت</div><h1>${s.hero} مأموریت ${s.name} تمام شد!</h1><div class="card" style="border-color:${s.color2}"><div class="big-emoji">${pct>=85?'🏆':pct>=65?'⭐':'💪'}</div><div class="q">امتیاز ${s.name}: ${faNum(pct)} از ۱۰۰</div><div class="hint">${pct>=85?'درخشان بود!':'تلاشت ارزشمند بود؛ اگر دوست داشتی یک دور دیگر تمرین کن.'}</div><button class="btn green" onclick="${allDone()?'showReport()':'home()'}">${allDone()?'کارنامه نهایی 🏅':'برگشت به ۴ درس'}</button><button class="btn secondary" onclick="subjectIntro(${state.current.si})">دوباره تمرین کن ↻</button></div>${footer()}`}
function lowestSubject(){return SUBJECTS.map(s=>({s,p:subjectPercent(s.id)})).sort((a,b)=>a.p-b.p)[0]}
function showReport(){const total=totalPercent(),low=lowestSubject(),now=new Date(),dt=new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(now),msg=total>=90?'قهرمان درخشان امروز 🌟':total>=75?'قهرمان پرتلاش امروز ⭐':'قهرمانِ در حال رشد 💪';app.className='report-wrap';app.innerHTML=`<section class="report"><h2>🏅 کارنامه قهرمان کلاس اول</h2><div class="report-name">${esc(state.name)}</div><div class="score-ring" style="--score:${total*3.6}deg"><div><b>${faNum(total)}</b><span>از ۱۰۰</span></div></div><div style="font-weight:900;font-size:14px">${msg}</div>${SUBJECTS.map(s=>{const p=subjectPercent(s.id);return `<div class="skillrow"><span>${s.icon} ${s.name}</span><span class="skillbar"><i style="width:${p}%"></i></span><span>${faNum(p)}</span></div>`}).join('')}<div class="report-note">پیشنهاد تمرین: ${low.p>=85?'همه‌ی مهارت‌ها خوب پیش رفته‌اند؛ برای تثبیت یک دور کوتاه دیگر بازی کن. 🌈':`برای «${low.s.name}» یک دور کوتاه دیگر تمرین کن. 🌱`}</div><div class="meta">تاریخ و ساعت: ${dt}</div><div class="shot">📸 حالا از این صفحه اسکرین‌شات بگیر و برای آموزگارت بفرست.</div><div class="footer">دبستان نبوت | آموزگار: خانم سرازدان</div></section><button class="round" style="position:fixed;right:8px;bottom:8px" onclick="app.className='shell';home()">🏠</button>`}
welcome();
</script>
</body>
</html>
