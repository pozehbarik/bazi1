<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>فایل‌های پروژه بازی ۱</title>

  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --border: #d0d7de;
      --border-soft: #e6e9ed;
      --accent: #0969da;
      --hover: #f6f8fa;
      --head: #f3f4f6;
      --danger: #cf222e;
      --shadow: 0 8px 30px rgba(140,149,159,.16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --border-soft: #262c36;
        --accent: #58a6ff;
        --hover: #1c2128;
        --head: #21262d;
        --danger: #ff7b72;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      width: min(980px, calc(100% - 28px));
      margin: 42px auto;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 2rem);
    }

    .subtitle {
      margin-top: 7px;
      color: var(--muted);
      font-size: .92rem;
      direction: ltr;
      text-align: right;
    }

    .refresh {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
      transition: .15s ease;
    }

    .refresh:hover {
      background: var(--hover);
      transform: translateY(-1px);
    }

    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 920px;
    }

    thead th {
      background: var(--head);
      color: var(--text);
      font-size: .88rem;
      font-weight: 700;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      white-space: nowrap;
    }

    thead th:not(:last-child),
    tbody td:not(:last-child) {
      border-left: 1px solid var(--border-soft);
    }

    tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border-soft);
      vertical-align: middle;
      font-size: .93rem;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr {
      transition: background .12s ease;
    }

    tbody tr:hover {
      background: var(--hover);
    }

    .num {
      width: 64px;
      text-align: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .name-col {
      width: 48%;
    }

    .file-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .file-link:hover {
      text-decoration: underline;
    }

    .meta {
      color: var(--muted);
      white-space: nowrap;
    }

    .commit-message {
      color: var(--text);
      min-width: 240px;
      max-width: 420px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .status {
      padding: 30px 18px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--danger);
    }

    .footer {
      margin-top: 13px;
      color: var(--muted);
      font-size: .82rem;
      line-height: 1.8;
    }

    @media (max-width: 700px) {
      .wrap {
        margin: 22px auto;
        width: min(100% - 18px, 980px);
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .table-card {
        border-radius: 13px;
      }

      thead th,
      tbody td {
        padding: 11px 12px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="topbar">
      <div>
        <h1>فایل‌های پروژه</h1>
        <div class="subtitle">pozehbarik / bazi1</div>
      </div>

      <button class="refresh" type="button" onclick="loadFiles()">
        ↻ بروزرسانی
      </button>
    </div>

    <section class="table-card" aria-live="polite">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="num">ردیف</th>
              <th class="name-col">نام فایل</th>
              <th>حجم</th>
              <th>آخرین تغییر</th>
              <th>متن آخرین commit</th>
            </tr>
          </thead>
          <tbody id="fileBody">
            <tr>
              <td colspan="5" class="status">در حال دریافت فایل‌ها…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="footer">
      تاریخ‌ها به تقویم شمسی نمایش داده می‌شوند و زمان، مربوط به آخرین commit هر فایل در GitHub است.
    </div>
  </main>

  <script>
    const CONFIG = {
      owner: "pozehbarik",
      repo: "bazi1",
      branch: "",
      path: ""
    };

    const $body = document.getElementById("fileBody");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatBytes(bytes) {
      if (bytes === 0) return "0 B";
      if (!Number.isFinite(bytes)) return "—";

      const units = ["B", "KB", "MB", "GB", "TB"];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));

      return `${(bytes / Math.pow(1024, i)).toFixed(i ? 1 : 0)} ${units[i]}`;
    }

    function formatPersianDate(iso) {
      if (!iso) return "—";

      const d = new Date(iso);

      const datePart = new Intl.DateTimeFormat("fa-IR-u-ca-persian", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(d);

      const timePart = new Intl.DateTimeFormat("fa-IR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(d);

      return `${datePart} - ${timePart}`;
    }

    async function githubFetch(url) {
      const response = await fetch(url, {
        headers: {
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
        }
      });

      if (!response.ok) {
        let detail = "";

        try {
          const data = await response.json();
          detail = data.message ? ` — ${data.message}` : "";
        } catch {}

        throw new Error(`GitHub API: ${response.status}${detail}`);
      }

      return response.json();
    }

    async function getLastCommitInfo(filePath) {
      const query = new URLSearchParams({
        path: filePath,
        per_page: "1"
      });

      if (CONFIG.branch) {
        query.set("sha", CONFIG.branch);
      }

      const url =
        `https://api.github.com/repos/${encodeURIComponent(CONFIG.owner)}` +
        `/${encodeURIComponent(CONFIG.repo)}/commits?${query}`;

      try {
        const commits = await githubFetch(url);
        const commit = commits?.[0]?.commit;

        return {
          date: commit?.committer?.date || commit?.author?.date || null,
          message: commit?.message || "—"
        };
      } catch (error) {
        console.warn("Commit lookup failed:", filePath, error);
        return {
          date: null,
          message: "—"
        };
      }
    }

    function relativeFileUrl(name) {
      return "./" + encodeURIComponent(name).replaceAll("%2F", "/");
    }

    async function loadFiles() {
      $body.innerHTML = `
        <tr>
          <td colspan="5" class="status">در حال دریافت فایل‌ها…</td>
        </tr>
      `;

      try {
        const encodedPath = CONFIG.path
          ? "/" + CONFIG.path.split("/").map(encodeURIComponent).join("/")
          : "";

        const query = new URLSearchParams();

        if (CONFIG.branch) {
          query.set("ref", CONFIG.branch);
        }

        const contentsUrl =
          `https://api.github.com/repos/${encodeURIComponent(CONFIG.owner)}` +
          `/${encodeURIComponent(CONFIG.repo)}/contents${encodedPath}` +
          (query.toString() ? `?${query}` : "");

        const items = await githubFetch(contentsUrl);

        if (!Array.isArray(items)) {
          throw new Error("مسیر انتخاب‌شده یک پوشه نیست.");
        }

        const files = items
          .filter(item =>
            item.type === "file" &&
            item.name.toLowerCase() !== "index.html"
          )
          .sort((a, b) =>
            a.name.localeCompare(b.name, undefined, {
              numeric: true,
              sensitivity: "base"
            })
          );

        if (!files.length) {
          $body.innerHTML = `
            <tr>
              <td colspan="5" class="status">فایلی در این پوشه پیدا نشد.</td>
            </tr>
          `;
          return;
        }

        const rows = new Array(files.length);
        let cursor = 0;
        const concurrency = 5;

        function renderRows() {
          $body.innerHTML = rows.filter(Boolean).join("");
        }

        async function worker() {
          while (cursor < files.length) {
            const index = cursor++;
            const file = files[index];
            const lastCommit = await getLastCommitInfo(file.path);

            rows[index] = `
              <tr>
                <td class="num">${index + 1}</td>
                <td>
                  <a
                    class="file-link"
                    href="${escapeHtml(relativeFileUrl(file.name))}"
                    title="${escapeHtml(file.name)}"
                  >📄 ${escapeHtml(file.name)}</a>
                </td>
                <td class="meta">${escapeHtml(formatBytes(file.size))}</td>
                <td class="meta">${escapeHtml(formatPersianDate(lastCommit.date))}</td>
                <td class="commit-message" title="${escapeHtml(lastCommit.message)}">
                  ${escapeHtml(lastCommit.message.split("\n")[0])}
                </td>
              </tr>
            `;

            renderRows();
          }
        }

        await Promise.all(
          Array.from(
            { length: Math.min(concurrency, files.length) },
            worker
          )
        );

      } catch (error) {
        console.error(error);

        let extra = "";

        if (String(error.message).includes("403")) {
          extra = "<br><br>ممکن است محدودیت درخواست‌های GitHub API موقتاً پر شده باشد.";
        }

        $body.innerHTML = `
          <tr>
            <td colspan="5" class="status error">
              دریافت فایل‌ها ممکن نشد.<br>
              ${escapeHtml(error.message)}
              ${extra}
            </td>
          </tr>
        `;
      }
    }

    loadFiles();
  </script>
</body>
</html>
