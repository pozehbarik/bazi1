<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<title>بازی آموزشی کلاس اول</title>
<style>
:root{
  --ink:#263238; --muted:#607d8b; --card:#ffffff; --bg1:#fff7e6; --bg2:#e9f8ff;
  --accent:#ff8a65; --accent2:#4fc3f7; --good:#2e7d32; --softgood:#e8f5e9;
  --line:#dfe7eb; --shadow:0 10px 28px rgba(38,50,56,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit}
button{touch-action:manipulation;cursor:pointer;border:0}
.app{width:min(760px,100%);min-height:100vh;margin:auto;display:flex;flex-direction:column;padding:12px}
.topbar{display:none;position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:20px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.progress{height:11px;background:#eef2f4;border-radius:999px;overflow:hidden;margin-top:8px}
.progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#81c784,#4fc3f7);transition:width .35s ease}
.screen{flex:1;display:flex;align-items:center;justify-content:center}
.card{width:100%;background:rgba(255,255,255,.97);border-radius:26px;box-shadow:var(--shadow);padding:18px;overflow:hidden}
.hero{text-align:center;padding:24px 18px}
.hero .mascot{font-size:58px;line-height:1;margin-bottom:8px}
h1{font-size:clamp(25px,6vw,36px);margin:8px 0 6px;color:#ef6c00}
.subtitle{font-size:16px;color:var(--muted);line-height:1.8;margin:0 auto 18px;max-width:560px}
.namebox{max-width:500px;margin:16px auto 8px;text-align:right}
.namebox label{display:block;font-weight:700;margin:0 4px 7px}
.namebox input{width:100%;border:2px solid #d9e3e7;border-radius:18px;padding:14px 16px;font-size:18px;outline:none;background:#fff}
.namebox input:focus{border-color:#4fc3f7;box-shadow:0 0 0 4px #4fc3f72a}
.bigbtn{display:inline-flex;align-items:center;justify-content:center;min-height:58px;min-width:190px;padding:14px 24px;border-radius:18px;background:linear-gradient(135deg,#ff9f68,#ff7043);color:#fff;font-weight:800;font-size:20px;box-shadow:0 8px 18px #ff70433b;margin-top:12px}
.bigbtn:active{transform:translateY(1px)}
.notice{min-height:24px;margin-top:8px;color:#c62828;font-weight:700;font-size:14px}
.privacy{font-size:13px;color:#78909c;margin-top:14px}
.mini-skills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{background:#f4f8fa;border:1px solid #e3ecef;border-radius:999px;padding:7px 10px;font-size:13px;color:#455a64}
.stage-head{text-align:center;margin-bottom:10px}
.stage-title{font-size:clamp(20px,5vw,28px);font-weight:900;margin:4px 0;color:#1565c0}
.stage-help{font-size:15px;color:#546e7a;line-height:1.7;margin:0}
.content{display:flex;flex-direction:column;align-items:center;gap:12px}
.feedback{min-height:44px;width:100%;border-radius:15px;padding:10px 12px;text-align:center;font-weight:800;display:flex;align-items:center;justify-content:center;color:#546e7a;background:#f7fafb}
.feedback.good{color:var(--good);background:var(--softgood)}
.feedback.try{color:#8d6e63;background:#fff8e1}
.choice-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{min-height:116px;background:#fff;border:2px solid #e3ebef;border-radius:20px;padding:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(38,50,56,.06);transition:.15s}
.choice:active{transform:scale(.98)}
.choice.selected{border-color:#29b6f6;box-shadow:0 0 0 4px #29b6f626}
.choice.correct{border-color:#66bb6a;background:#f1fff2}
.choice img{max-width:100%;max-height:108px;object-fit:contain;border-radius:13px}
.target-card{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff8e1;border:2px dashed #ffb74d;border-radius:22px;padding:10px 18px;min-width:180px}
.target-card img{height:105px;max-width:180px;object-fit:contain;border-radius:14px}
.target-label{font-size:13px;color:#795548;font-weight:700}
.checkbtn,.nextbtn,.ghostbtn{min-height:50px;border-radius:16px;padding:11px 18px;font-weight:800;font-size:17px}
.checkbtn,.nextbtn{background:#42a5f5;color:#fff;box-shadow:0 6px 14px #42a5f533}
.nextbtn{display:none;background:#66bb6a}
.ghostbtn{background:#f2f5f7;color:#455a64;border:1px solid #dce5e9}
.scene-preview{width:min(100%,420px);max-height:210px;object-fit:cover;object-position:center 36%;border-radius:18px;border:1px solid #e0e6e9}
.multi-grid{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.multi-grid .choice{min-height:98px;padding:6px}
.multi-grid .choice img{max-height:84px}
.connect-wrap{position:relative;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:start;padding:4px}
.connect-col{display:flex;flex-direction:column;gap:12px;z-index:2}
.match-card{background:white;border:2px solid #e1e9ed;border-radius:18px;min-height:110px;padding:6px;display:flex;align-items:center;justify-content:center;position:relative}
.match-card.selected{border-color:#29b6f6;box-shadow:0 0 0 4px #29b6f626}
.match-card.done{border-color:#66bb6a;background:#f1fff2}
.match-card img{width:100%;height:96px;object-fit:contain;border-radius:12px}
.lines{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.number-options{display:flex;gap:12px;justify-content:center;flex-wrap:nowrap;width:100%}
.num-btn{width:clamp(78px,24vw,130px);height:88px;border-radius:22px;background:#fff;border:2px solid #dce6eb;font-size:42px;font-weight:900;color:#37474f;box-shadow:0 4px 12px rgba(38,50,56,.06)}
.num-btn.correct{border-color:#66bb6a;background:#f1fff2}
.finger-img{width:165px;height:165px;object-fit:contain;border-radius:24px;background:#fff8dc;border:2px solid #ffe082}
.pattern-row{width:100%;display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:clamp(4px,1.2vw,10px);direction:ltr;overflow:hidden;padding:8px 0}
.shape{flex:0 1 52px;width:clamp(28px,8vw,52px);aspect-ratio:1/1;display:block}
.circle{border-radius:50%}.square{border-radius:4px}.blank{border:3px dashed #90a4ae;border-radius:12px;background:#fafcfd;display:flex;align-items:center;justify-content:center;font-weight:900;color:#90a4ae;font-size:22px}
.triangle{width:0;height:0;aspect-ratio:auto;border-left:clamp(15px,4vw,26px) solid transparent;border-right:clamp(15px,4vw,26px) solid transparent;border-top:clamp(30px,8vw,52px) solid;flex:0 1 auto}
.pattern-options{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:6px}
.pattern-btn{width:86px;height:82px;border-radius:18px;background:#fff;border:2px solid #dce6eb;display:flex;align-items:center;justify-content:center}
.pattern-btn .shape{width:48px;flex:0 0 48px}
.trace-box{width:100%;background:#fcfeff;border:2px solid #dce8ed;border-radius:22px;padding:8px;overflow:hidden}
#traceCanvas{width:100%;height:auto;display:block;touch-action:none;border-radius:14px;background:linear-gradient(#fff,#fbfdff)}
.trace-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tip{font-size:13px;color:#78909c;text-align:center;line-height:1.6}
.report{text-align:center;padding:18px 14px}
.report h2{font-size:28px;color:#ef6c00;margin:4px 0 10px}
.score-orb{width:146px;height:146px;border-radius:50%;margin:10px auto 12px;background:linear-gradient(145deg,#fff3e0,#e3f2fd);border:8px solid #fff;box-shadow:0 8px 25px #455a6420;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-orb b{font-size:42px;color:#1565c0}.score-orb span{font-size:14px;color:#607d8b}
.stars{font-size:28px;margin:5px 0}.report-name{font-weight:900;font-size:20px;margin:6px 0}.skill-list{display:grid;gap:8px;margin:14px 0;text-align:right}
.skill-row{background:#f8fafb;border:1px solid #e6ecef;border-radius:14px;padding:10px 12px}.skill-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:800}.skillbar{height:9px;background:#e9eff2;border-radius:999px;overflow:hidden;margin-top:7px}.skillbar span{display:block;height:100%;background:linear-gradient(90deg,#81c784,#4fc3f7)}
.suggestion{background:#fff8e1;border:1px solid #ffe0a3;border-radius:16px;padding:11px 12px;line-height:1.7;font-size:14px;text-align:right}.stamp{font-size:13px;color:#607d8b;margin:10px 0}.shot{font-weight:900;color:#6a1b9a;background:#f3e5f5;border-radius:16px;padding:11px 12px;margin-top:10px}
.footer{padding:12px 6px 4px;text-align:center;color:#78909c;font-size:12px;line-height:1.6}
.hide{display:none!important}
@media(max-width:560px){
  .app{padding:8px}.card{padding:14px;border-radius:22px}.choice-grid{gap:8px}.choice{min-height:100px}.choice img{max-height:92px}
  .multi-grid{grid-template-columns:repeat(5,1fr);gap:5px}.multi-grid .choice{min-height:78px}.multi-grid .choice img{max-height:68px}
  .connect-wrap{gap:22px}.match-card{min-height:88px}.match-card img{height:76px}
  .finger-img{width:140px;height:140px}.num-btn{height:78px;font-size:38px}
  .report{padding:10px 6px}.score-orb{width:128px;height:128px}.score-orb b{font-size:36px}
}
@media(max-width:360px){.connect-wrap{gap:14px}.choice{padding:5px}.multi-grid .choice{min-height:70px}.stage-help{font-size:14px}.card{padding:11px}.shape{width:26px}.triangle{border-left-width:14px;border-right-width:14px;border-top-width:28px}}
@media print{body{background:#fff}.topbar,.footer,.nextbtn,.ghostbtn,.checkbtn{display:none!important}.app{padding:0}.card{box-shadow:none;border:0}.screen{align-items:flex-start}}

.trace-source{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:#fff8e1;border:1px solid #ffe0a3;color:#795548;border-radius:14px;padding:8px 10px;font-size:13px;font-weight:800}
.trace-source b{color:#ef6c00}

/* نسخه‌ی اصلاح‌شده: مسیریابی راست‌به‌چپ، تمرین‌های بیشتر و کارنامه‌ی تک‌صفحه‌ای */
.trace-actions .ghostbtn{pointer-events:auto!important;opacity:1!important;position:relative;z-index:3}
.report-msg{font-weight:900;color:#2e7d32;font-size:13px;line-height:1.4}
.report-top{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right}
.report-summary{flex:1;min-width:0}
.report-footer{font-size:11px;color:#78909c;margin-top:6px;padding-top:5px;border-top:1px dashed #dfe7eb}
body.report-mode{overflow:hidden}
body.report-mode .topbar,body.report-mode>.topbar,body.report-mode .footer{display:none!important}
body.report-mode .app{height:100dvh;min-height:100dvh;padding:5px}
body.report-mode .screen{height:100%;min-height:0;align-items:center}
body.report-mode .compact-report{max-height:calc(100dvh - 10px);overflow:hidden;padding:10px 12px;border-radius:20px}
body.report-mode .compact-report h2{font-size:clamp(20px,5vw,25px);margin:0 0 3px}
body.report-mode .compact-report .report-name{font-size:17px;margin:2px 0}
body.report-mode .compact-report .score-orb{width:82px;height:82px;min-width:82px;margin:0;border-width:5px;box-shadow:0 5px 14px #455a641a}
body.report-mode .compact-report .score-orb b{font-size:29px;line-height:1}
body.report-mode .compact-report .score-orb span{font-size:11px}
body.report-mode .compact-report .stars{font-size:20px;line-height:1.1;margin:3px 0}
body.report-mode .compact-report .skill-list{gap:4px;margin:7px 0}
body.report-mode .compact-report .skill-row{padding:5px 8px;border-radius:10px}
body.report-mode .compact-report .skill-top{font-size:11.5px;line-height:1.25}
body.report-mode .compact-report .skillbar{height:5px;margin-top:3px}
body.report-mode .compact-report .suggestion{padding:6px 8px;border-radius:10px;line-height:1.45;font-size:11.5px}
body.report-mode .compact-report .stamp{font-size:10.5px;margin:5px 0}
body.report-mode .compact-report .shot{font-size:12px;border-radius:10px;padding:7px 8px;margin-top:5px;line-height:1.45}
@media(max-height:650px){
  body.report-mode .compact-report{padding:7px 9px}
  body.report-mode .compact-report h2{font-size:18px}
  body.report-mode .compact-report .score-orb{width:68px;height:68px;min-width:68px}
  body.report-mode .compact-report .score-orb b{font-size:24px}
  body.report-mode .compact-report .skill-row{padding:4px 6px}
  body.report-mode .compact-report .skill-top{font-size:10.5px}
  body.report-mode .compact-report .suggestion,body.report-mode .compact-report .shot{font-size:10.5px;padding:5px 7px}
  body.report-mode .compact-report .stamp,.report-footer{font-size:9.5px}
}



/* مسیریابی ویژه‌ی نوآموزان کلاس اول: لوحه‌ی شبیه «ب» بدون نقطه */
.trace-box{padding:7px;background:#fff;border:2px solid #d9eaf2;box-shadow:inset 0 0 0 3px #f4fbff}
#traceCanvas{width:100%;height:auto;display:block;touch-action:none;border-radius:16px;background:#fff;user-select:none;-webkit-user-select:none}
.trace-reference{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fffaf0;border:1px solid #ffe0a3;border-radius:15px;padding:7px 10px;color:#6d4c41;font-size:12.5px;font-weight:800}
.trace-reference img{width:min(210px,56vw);height:70px;object-fit:contain;border-radius:10px;background:#fff}
.trace-key{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:800;color:#546e7a;background:#f5fbff;border:1px solid #dcecf5;border-radius:14px;padding:7px 10px}
.trace-key .start{color:#2e7d32}.trace-key .end{color:#8e24aa}.trace-key .arrow{font-size:22px;color:#42a5f5;line-height:1}
.trace-actions .ghostbtn{min-width:210px;background:#fff4e5;border:2px solid #ffd39c;color:#8d5a24;box-shadow:0 4px 10px rgba(141,90,36,.08)}
.trace-actions .ghostbtn:active{transform:translateY(1px)}
@media(max-width:560px){
  .trace-box{padding:5px;border-radius:18px}
  .trace-reference{font-size:11.5px;padding:6px 8px}.trace-reference img{height:58px}
  .trace-key{font-size:12px;padding:6px 8px;gap:6px}.trace-key .arrow{font-size:19px}
}

</style>
</head>

  <div class="topbar" id="topbar">
    <div class="toprow"><span id="stageLabel">مرحله ۱ از ۱۶</span><span id="scoreLabel">امتیاز: ۰ از ۱۰۰</span></div>
    <div class="progress"><span id="progressBar"></span></div>
  </div>
  <main class="screen" id="screen"></main>
  <footer class="footer">دبستان نبوت | آموزگار: خانم سرازدان</footer>
</div>

function makeTracePoints(kind){
  // همه‌ی لوحه‌ها از راست به چپ و در خانواده‌ی همان لوحه‌ی کتاب هستند:
  // یک فرود نرم از سمت راست، خط افقیِ بلند، و یک بالا آمدن کوتاه در سمت چپ؛ بدون نقطه‌ی زیر.
  var specs=[
    {sx:610,sy:72, rx1:610,ry1:118, rx2:570,ry2:146, join:525, base:146, leftJoin:165, lx1:145,ly1:146, lx2:124,ly2:132, ex:116,ey:112},
    {sx:600,sy:94, rx1:600,ry1:118, rx2:568,ry2:140, join:525, base:140, leftJoin:175, lx1:154,ly1:140, lx2:136,ly2:131, ex:126,ey:118},
    {sx:595,sy:80, rx1:595,ry1:119, rx2:558,ry2:150, join:510, base:150, leftJoin:188, lx1:164,ly1:150, lx2:142,ly2:136, ex:132,ey:116},
    {sx:620,sy:84, rx1:620,ry1:122, rx2:582,ry2:145, join:535, base:145, leftJoin:145, lx1:126,ly1:145, lx2:108,ly2:133, ex:100,ey:116},
    {sx:615,sy:68, rx1:615,ry1:119, rx2:572,ry2:152, join:520, base:152, leftJoin:160, lx1:138,ly1:152, lx2:116,ly2:136, ex:106,ey:112}
  ];
  var sp=specs[kind]||specs[0], pts=[];
  function add(x,y){pts.push({x:x,y:y});}
  function cubic(p0,p1,p2,p3,n,skipFirst){
    for(var i=skipFirst?1:0;i<=n;i++){
      var t=i/n,mt=1-t;
      add(mt*mt*mt*p0.x+3*mt*mt*t*p1.x+3*mt*t*t*p2.x+t*t*t*p3.x,
          mt*mt*mt*p0.y+3*mt*mt*t*p1.y+3*mt*t*t*p2.y+t*t*t*p3.y);
    }
  }
  var p0={x:sp.sx,y:sp.sy},p1={x:sp.rx1,y:sp.ry1},p2={x:sp.rx2,y:sp.ry2},p3={x:sp.join,y:sp.base};
  cubic(p0,p1,p2,p3,28,false);
  var straightStart=pts[pts.length-1];
  for(var j=1;j<=58;j++){var u=j/58;add(straightStart.x+(sp.leftJoin-straightStart.x)*u,sp.base);}
  var q0=pts[pts.length-1],q1={x:sp.lx1,y:sp.ly1},q2={x:sp.lx2,y:sp.ly2},q3={x:sp.ex,y:sp.ey};
  cubic(q0,q1,q2,q3,22,true);
  return pts;
}
function stageTrace(kind){
  var titles=['لوحه‌ی کتاب ✏️','لوحه‌ی ساده ۱ ✏️','لوحه‌ی ساده ۲ ✏️','لوحه‌ی بلند ✏️','لوحه‌ی کامل ✏️'];
  var source = kind===0?'<div class="trace-reference"><span>📘 نمونه‌ی کتاب</span>'+img(A.traceBookTop,'نمونه لوحه‌ی کتاب')+'</div>':'';
  var key='<div class="trace-key"><span class="start">⭐ شروع از راست</span><span class="arrow">←</span><span>روی نقطه‌های آبی</span><span class="arrow">←</span><span class="end">🌷 پایان در چپ</span></div>';
  layout(titles[kind]||'مسیر را دنبال کن ✏️','انگشتت را روی ⭐ بگذار؛ آرام روی نقطه‌های آبی تا 🌷 برو.', source+key+'<div class="trace-box"><canvas id="traceCanvas" width="700" height="320"></canvas></div><div class="trace-actions"><button type="button" class="ghostbtn" id="clearTrace">پاک کن و از اول بنویس ↻</button></div><div class="tip">این لوحه شبیه شکل «ب» است، اما نقطه‌ی زیر ندارد. حرکت را یک‌دست و آرام انجام بده.</div>');
  var canvas=document.getElementById('traceCanvas'),ctx=canvas.getContext('2d'),pts=makeTracePoints(kind),progress=0,drawing=false,hasInk=false;

  function strokePath(color,width,dash,alpha){
    ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(dash||[]);
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();ctx.restore();
  }
  function drawArrowAt(idx){
    var a=pts[Math.max(0,idx-2)],b=pts[Math.min(pts.length-1,idx+2)],p=pts[idx];
    var ang=Math.atan2(b.y-a.y,b.x-a.x),len=18,head=8;
    ctx.save();ctx.strokeStyle='rgba(30,136,229,.58)';ctx.fillStyle='rgba(30,136,229,.58)';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(p.x-len*.55*Math.cos(ang),p.y-len*.55*Math.sin(ang));ctx.lineTo(p.x+len*.55*Math.cos(ang),p.y+len*.55*Math.sin(ang));ctx.stroke();
    var tx=p.x+len*.55*Math.cos(ang),ty=p.y+len*.55*Math.sin(ang);

  }
  function drawEndpoint(p,fill,stroke,emoji,label,labelColor){
    ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,29,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=stroke;ctx.stroke();
    ctx.font='31px Tahoma,Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#263238';ctx.fillText(emoji,p.x,p.y+1);
    ctx.font='bold 18px Tahoma,Arial';ctx.fillStyle=labelColor;ctx.fillText(label,p.x,p.y-49);ctx.restore();
  }
  function drawBase(){
    ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);
    // «جاده»ی پهن و روشن به کودک می‌گوید دستش باید در چه محدوده‌ای حرکت کند.
    strokePath('#e6f5ff',44,[],1);
    strokePath('#bfe4f8',30,[],.85);
    // خط مرکزی شبیه نقطه‌چین آبی خود کتاب.
    strokePath('#42a5f5',7,[2,13],1);

    drawEndpoint(pts[0],'#e8f5e9','#66bb6a','⭐','شروع','#2e7d32');

  }
  function pos(e){var r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};}
  function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}
  function nearestAhead(p){
    var best=-1,bestD=1e9,end=Math.min(pts.length-1,progress+15);
    for(var i=Math.max(0,progress-2);i<=end;i++){var d=dist(p,pts[i]);if(d<bestD){bestD=d;best=i;}}
    return{idx:best,d:bestD};
  }
  function down(e){
    e.preventDefault();var p=pos(e);
    if(progress===0 && dist(p,pts[0])>66){feedback('اول انگشتت را روی ستاره‌ی سمت راست ⭐ بگذار.','try');return;}

  }

    try{if(e&&canvas.hasPointerCapture&&canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);}catch(_e){}
    if(progress>0 && progress<pts.length*.97)feedback('خیلی خوب؛ از همان جایی که رسیدی ادامه بده 🌱','');
  }
  function advance(p){
    var hit=nearestAhead(p);

  }
  canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);

  });
  drawBase();
}

function categoryData(){return categories.map(function(c){var got=0,max=0;c.stages.forEach(function(i){got+=stageScores[i];max+=stageMaxPoints[i]});return{name:c.name,got:got,max:max,pct:max?Math.round(got/max*100):0,tip:c.tip}})}
function dateText(){try{return new Date().toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'})}catch(e){var d=new Date();return fa(d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' - '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'))}}
function showReport(){
  current=totalStages;updateTop();progressBar.style.width='100%';stageLabel.textContent='کارنامه';scoreLabel.textContent='امتیاز: '+fa(totalScore)+' از ۱۰۰';
  document.body.classList.add('report-mode');
  var cats=categoryData(),lowest=cats.slice().sort(function(a,b){return a.pct-b.pct})[0];
  var stars=totalScore>=90?'⭐⭐⭐':(totalScore>=70?'⭐⭐':'⭐');
  var msg=totalScore>=90?'درخشان بودی!':(totalScore>=75?'خیلی خوب پیش رفتی!':(totalScore>=60?'آفرین، ادامه بده!':'با چند تمرین کوتاه، بهتر می‌شوی 🌱'));
  var rows=cats.map(function(c){return '<div class="skill-row"><div class="skill-top"><span>'+c.name+'</span><span>'+fa(c.pct)+'٪</span></div><div class="skillbar"><span style="width:'+c.pct+'%"></span></div></div>';}).join('');
  screen.innerHTML='<section class="card report compact-report">'+
    '<div class="report-top"><div class="report-summary"><h2>کارنامه‌ی بازی 🎉</h2><div class="report-name">'+esc(studentName)+'</div><div class="stars">'+stars+'</div><div class="report-msg">'+msg+'</div></div><div class="score-orb"><b>'+fa(totalScore)+'</b><span>از ۱۰۰</span></div></div>'+
    '<div class="skill-list">'+rows+'</div>'+
    '<div class="suggestion"><b>پیشنهاد تمرین:</b> '+lowest.tip+'</div>'+
    '<div class="stamp">🕒 '+dateText()+'</div>'+
    '<div class="shot">📸 حالا از این صفحه اسکرین‌شات بگیر و برای آموزگارت بفرست.</div>'+
    '<div class="report-footer">دبستان نبوت | آموزگار: خانم سرازدان</div>'+
    '</section>';
}

startScreen();
})();
</script>
</body>
</html>
